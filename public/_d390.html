<style>
html,body{margin:0;background:#050506;min-height:100%;font-family:Inter,system-ui,sans-serif}
.row{display:flex;gap:22px;justify-content:center;padding:14px}
.col{display:flex;flex-direction:column;align-items:center;gap:7px}
.cap{font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:#f1ca45}
.phone{width:390px;height:844px;border:5px solid #16171a;border-radius:24px;overflow:hidden}
iframe{width:390px;height:844px;border:0;display:block}
</style>
<div class="row">
  <div class="col"><div class="cap">Matchup</div><div class="phone"><iframe data-t="matchup" src="/_desktop.html"></iframe></div></div>
  <div class="col"><div class="cap">Field</div><div class="phone"><iframe data-t="field" src="/_desktop.html"></iframe></div></div>
  <div class="col"><div class="cap">Bullpen</div><div class="phone"><iframe data-t="pen" src="/_desktop.html"></iframe></div></div>
</div>
<script>
document.querySelectorAll('iframe').forEach(function(f){
  f.addEventListener('load',function(){
    var D=f.contentDocument, t=f.dataset.t;
    var sc=D.querySelector('.screen');
    ['matchup','field','log','pen','bench'].forEach(function(k){sc.classList.remove('m-'+k)});
    sc.classList.add('m-'+t);
    D.querySelectorAll('.tabbar button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
  });
});
</script>
