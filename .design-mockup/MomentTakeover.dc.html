<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; background: #070809; color: #f5f1e6; }
    a { color: #d8ad2d; } a:hover { color: #f1ca45; }
    .lbl { font-size: 10px; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; color: #f1ca45; }
    .sub { font-size: 10px; color: #777a80; letter-spacing: 0.03em; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; background: #070809; position: relative; overflow: hidden; box-sizing: border-box;">

  <!-- the normal screen, still there underneath -->
  <div style="position: absolute; inset: 0; padding: 16px; display: grid; grid-template-columns: 248px minmax(0,1fr) 248px; gap: 12px; filter: blur(2.5px); opacity: 0.22;">
    <div style="background: #111214; border: 1px solid rgba(216,173,45,0.34); border-radius: 12px;"></div>
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="height: 74px; background: #0b0c0e; border: 1px solid rgba(216,173,45,0.34); border-radius: 10px;"></div>
      <div style="flex-grow: 1; background: #111214; border: 1px solid rgba(216,173,45,0.34); border-radius: 12px;"></div>
      <div style="height: 60px; background: #d8ad2d; border-radius: 10px;"></div>
    </div>
    <div style="background: #111214; border: 1px solid rgba(216,173,45,0.34); border-radius: 12px;"></div>
  </div>

  <!-- gold wash from the point of contact -->
  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 900px 620px at 50% 46%, rgba(216,173,45,0.20) 0%, rgba(216,173,45,0.06) 42%, rgba(7,8,9,0) 72%);"></div>

  <!-- rays -->
  <svg width="1440" height="900" viewBox="0 0 1440 900" style="position: absolute; inset: 0;" fill="none">
    <g opacity="0.16" stroke="#d8ad2d" stroke-width="1.4">
      <path d="M720 414 L280 90"/><path d="M720 414 L1160 90"/><path d="M720 414 L120 330"/>
      <path d="M720 414 L1320 330"/><path d="M720 414 L340 800"/><path d="M720 414 L1100 800"/>
      <path d="M720 414 L640 40"/><path d="M720 414 L800 40"/>
    </g>
  </svg>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 0 80px; box-sizing: border-box;">

    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="height: 1px; width: 54px; background: rgba(216,173,45,0.5);"></span>
      <span style="font-size: 12px; font-weight: 900; letter-spacing: 0.34em; color: #d8ad2d;">BOTTOM 9 &middot; TWO OUT</span>
      <span style="height: 1px; width: 54px; background: rgba(216,173,45,0.5);"></span>
    </div>

    <div style="font-size: 108px; font-weight: 900; letter-spacing: -0.035em; line-height: 0.92; color: #f1ca45; text-align: center; text-shadow: 0 0 58px rgba(216,173,45,0.4);">WALK-OFF</div>

    <div style="display: flex; align-items: center; gap: 30px;">
      <div style="width: 176px; height: 246px; border: 2px solid #d8ad2d; border-radius: 10px; background: repeating-linear-gradient(135deg, #16171a 0 10px, #141518 10px 20px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; box-shadow: 0 0 44px rgba(216,173,45,0.28);">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#6f5b1e" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-4-9 8"/></svg>
        <span style="font-size: 10px; color: #6f5b1e; letter-spacing: 0.08em;">CARD ART</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 11px;">
        <div style="font-size: 46px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.05;">Mule Suttles</div>
        <div style="display: flex; align-items: center; gap: 13px;">
          <span style="border: 1px solid #f1ca45; color: #f1ca45; border-radius: 5px; padding: 5px 13px; font-size: 19px; font-weight: 900; letter-spacing: 0.08em;">HR</span>
          <span style="font-size: 19px; color: #f5f1e6; font-weight: 700;">Three-run home run</span>
        </div>
        <div style="font-size: 15px; color: #aeafb2;">Swing roll <span style="color: #f1ca45; font-weight: 800;">20</span> on the hitter chart &middot; hitter advantage</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 34px; border-top: 1px solid rgba(216,173,45,0.28); border-bottom: 1px solid rgba(216,173,45,0.28); padding: 18px 46px;">
      <div style="text-align: center;"><div class="sub" style="letter-spacing: 0.16em;">BEN</div><div style="font-size: 40px; font-weight: 900; line-height: 1;">3</div></div>
      <span style="font-size: 16px; color: #6f5b1e; font-weight: 800;">FINAL</span>
      <div style="text-align: center;"><div class="sub" style="letter-spacing: 0.16em; color: #d8ad2d;">ANTHONY</div><div style="font-size: 40px; font-weight: 900; line-height: 1; color: #f1ca45;">8</div></div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; margin-top: 4px;">
      <button style="min-height: 50px; padding: 0 30px; border: none; border-radius: 8px; background: #d8ad2d; color: #070809; font-family: inherit; font-size: 14px; font-weight: 900; letter-spacing: 0.1em; cursor: pointer;">VIEW BOX SCORE</button>
      <button style="min-height: 50px; padding: 0 26px; border: 1px solid rgba(216,173,45,0.4); border-radius: 8px; background: transparent; color: #aeafb2; font-family: inherit; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; cursor: pointer;">DISMISS</button>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 20px; text-align: center;">
    <span class="sub" style="color: #4a4b4f;">Takeover is presentation only &mdash; the play is already resolved and persisted before it plays. Dismissible, and skipped entirely under reduced-motion.</span>
  </div>
</div>
</x-dc>
</body>
</html>
